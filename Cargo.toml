[package]
name = "luma"
version = "2.2.160"
edition = "2024"
rust-version = "1.88"
publish = false
default-run = "luma"
license = "MIT"
description = "A remote-first native launcher for rooted LG webOS TVs"

[workspace]
members = ["vector-geometry", "tools/vector-assets"]
resolver = "3"

[features]
default = []
webos = ["dep:libc"]

[dependencies]
aes = "0.8"
gl = "0.14"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
libc = { version = "0.2", optional = true }
luma-vector-geometry = { path = "vector-geometry" }
if-addrs = "0.15"
mdns-sd = { version = "0.21.6", default-features = false }
owned_ttf_parser = "0.25"
rand = "0.8"
rcgen = "0.13"
rsa = "0.9"
rustls = "0.23"
rustls-pemfile = "2.2"
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["oid"] }
signature = "2.2"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
qrcode = { version = "0.14.1", default-features = false }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
url = "2.5"
x509-parser = "0.17"
base64 = "0.22"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1

# Keep on-demand glyph geometry responsive in desktop debug previews.
[profile.dev.package.lyon_tessellation]
opt-level = 3
